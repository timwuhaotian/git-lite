name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${{ github.ref_name }}" --generate-notes

  build:
    needs: release
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and package gl
        run: |
          cargo build --release --locked --target "${{ matrix.target }}" -p gl-client
          tar -C "target/${{ matrix.target }}/release" -czf "gl-${{ matrix.target }}.tar.gz" gl
      - name: Build and package gl-server
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo build --release --locked --target "${{ matrix.target }}" -p gl-server
          tar -C "target/${{ matrix.target }}/release" -czf "gl-server-${{ matrix.target }}.tar.gz" gl-server
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ github.ref_name }}" ./*.tar.gz --clobber
