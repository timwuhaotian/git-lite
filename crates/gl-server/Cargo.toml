[package]
name = "gl-server"
version.workspace = true
edition = "2021"

[[bin]]
name = "gl-server"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
gl-core = { path = "../gl-core" }
